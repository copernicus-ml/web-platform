name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: ["completed"]
    branches: ["main"]

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'

    runs-on: ubuntu-latest

    concurrency:
      group: cloudflare-pages-production
      cancel-in-progress: true

    environment: production

    steps:
      - name: Check out the CI commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.x
          cache: npm

      - name: Install and build
        run: |
          npm ci
          npm run build
        env:
          VITE_DATA_ENDPOINT: ${{ vars.VITE_DATA_ENDPOINT }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ vars.VITE_CLERK_PUBLISHABLE_KEY }}

      - name: Deploy to Cloudflare Pages
        run: >
          npx --yes wrangler@4 pages deploy dist
          --project-name "$CLOUDFLARE_PAGES_PROJECT"
          --branch main
          --commit-hash "$COMMIT_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
          COMMIT_SHA: ${{ github.event.workflow_run.head_sha }}
